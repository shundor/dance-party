<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d4cff" />
    <title>Dance Party! — History</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪩</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="side side-left" id="back" href="/queue">‹ Queue</a>
      <h1 class="logo">Dance Party!</h1>
      <a class="side join-link" id="join" href="/">Join ›</a>
    </header>
    <main>
      <section class="card">
        <h2 class="section-title">Play history <span id="total"></span></h2>
        <p id="join-hint" class="hint hidden"><a href="/">Join the party</a> to add these songs to the queue again.</p>
        <div class="history-search"><input id="search" class="big" type="search" placeholder="Search songs or who added them" autocomplete="off" aria-label="Search history" /></div>
        <div id="list" class="history"><div class="empty">Loading…</div></div>
        <button id="more" class="more hidden" type="button">Load more</button>
      </section>
    </main>
    <div id="toast" class="toast hidden"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/history.js" type="module"></script>
  </body>
</html>
