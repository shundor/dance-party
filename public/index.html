<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d4cff" />
    <title>Dance Party!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪩</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar"><h1 class="logo">Dance Party!</h1></header>
    <main>
      <form id="join" autocomplete="off" novalidate>
        <div id="code-wrap">
          <label class="field-label" for="code">Room code</label>
          <input id="code" class="big upper" maxlength="4" placeholder="Enter 4-letter code" autocapitalize="characters" spellcheck="false" />
        </div>

        <label class="field-label" for="name"><span>Name</span><span id="count">12</span></label>
        <input id="name" class="big" maxlength="12" placeholder="Enter your name" />

        <div id="pin-wrap" class="hidden">
          <label class="field-label" for="pin">Admin PIN</label>
          <input id="pin" class="big" type="password" inputmode="numeric" placeholder="Optional" />
        </div>

        <button id="play" class="btn-play" type="submit" disabled>PLAY</button>
        <div id="error" class="error" role="alert"></div>
        <p class="hint"><button id="host" type="button" class="link-btn">I'm a host (admin)</button></p>
      </form>
    </main>
    <script src="/help.js" type="module"></script>
    <script src="/join.js" type="module"></script>
  </body>
</html>
