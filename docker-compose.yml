# Dance Party! — run with:  docker compose up -d
# Settings come from .env (copy .env.example). Inside a container the server can't see your
# computer's LAN address or name, so set PUBLIC_URL and TV_HOST in .env (see README).
services:
  dance-party:
    build: .
    image: dance-party
    container_name: dance-party
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      DB_PATH: /app/data/dance-party.db
      # e.g. http://192.168.1.50:3000 — the address phones open (shown on the TV and in the QR code)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # e.g. mymac.local or 192-168-1-50.nip.io — hostname the TV uses (YouTube blocks some videos on bare IPs)
      TV_HOST: ${TV_HOST:-}
    volumes:
      - dance-party-data:/app/data

volumes:
  dance-party-data:
